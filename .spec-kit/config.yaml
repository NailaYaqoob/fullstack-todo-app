name: fullstack-todo-app
version: "1.0"

structure:
  specs_dir: specs
  features_dir: specs/features
  api_dir: specs/api
  database_dir: specs/database
  ui_dir: specs/ui

phases:
  - name: phase2-web
    features: [task-crud, authentication]
  - name: phase3-chatbot
    features: [task-crud, authentication, chatbot]

stack:
  frontend:
    framework: Next.js 16+
    router: App Router
    language: TypeScript
    styling: Tailwind CSS
  backend:
    framework: FastAPI
    language: Python
    orm: SQLModel
    database: Neon Serverless PostgreSQL
  auth:
    library: Better Auth
    strategy: JWT tokens
    shared_secret_env: BETTER_AUTH_SECRET
